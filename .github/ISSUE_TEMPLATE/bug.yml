name: Bug
description: Something in forkguard itself does not work
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: I ran forkguard fix and it stopped with an error.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: |
        1. Run `forkguard setup`
        2. Open a new terminal
        3. Run `npm install`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: forkguard version
      description: Run `forkguard --version`
      placeholder: 0.2.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true

  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options: [PowerShell, Git Bash, bash, zsh, Other]

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Run `node --version`
      placeholder: v22.23.4
